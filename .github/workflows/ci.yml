name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm install
      - run: node --run prettier
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm install
      - run: node --run eslint
  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm install
      - run: node --run types
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.13.0", "22", "24.0.0", "24", "26.0.0", "26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: node --run test
